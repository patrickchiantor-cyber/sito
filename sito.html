<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buon Compleanno! 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4fa3; --yellow:#ffd23f; --blue:#3ec6ff; --purple:#8b5cf6; --green:#3ddc97; --orange:#ff8a3d;
    --ink:#2a1650; --cream:#fff8ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Fredoka',sans-serif;color:var(--ink);background:var(--cream);
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(255,79,163,.18) 0 160px, transparent 161px),
      radial-gradient(circle at 90% 30%, rgba(62,198,255,.2) 0 200px, transparent 201px),
      radial-gradient(circle at 20% 70%, rgba(255,210,63,.25) 0 180px, transparent 181px),
      radial-gradient(circle at 85% 90%, rgba(139,92,246,.18) 0 220px, transparent 221px);
    background-attachment:fixed;
  }
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
  .balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .balloons span{position:absolute;bottom:-80px;animation:float linear infinite}
  @keyframes float{
    0%{transform:translateY(0) translateX(0) rotate(-6deg)}
    50%{transform:translateY(-60vh) translateX(25px) rotate(6deg)}
    100%{transform:translateY(-130vh) translateX(-10px) rotate(-4deg)}
  }
  section{position:relative;z-index:2;padding:90px 20px;max-width:980px;margin:0 auto;text-align:center}

  /* HERO */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .pill{display:inline-block;background:var(--ink);color:var(--yellow);padding:8px 20px;border-radius:999px;
        font-weight:600;letter-spacing:.08em;font-size:.9rem;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--pink)}
  h1{font-size:clamp(3rem,13vw,7.5rem);line-height:.95;font-weight:700;margin:14px 0 4px;
     text-shadow:4px 4px 0 var(--yellow)}
  h1 .name{
    display:inline-block;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
    animation:wiggle 3s ease-in-out infinite;
  }
  @keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.04)}}
  .hand{font-family:'Caveat',cursive;font-size:clamp(1.6rem,5vw,2.4rem);color:var(--purple)}
  .cake{width:min(260px,62vw);cursor:pointer;margin-top:8px;filter:drop-shadow(0 12px 0 rgba(42,22,80,.12));transition:transform .2s}
  .cake:hover{transform:scale(1.04) rotate(-1deg)}
  .flame{transform-origin:center bottom;animation:flick .35s ease-in-out infinite alternate}
  .flame:nth-of-type(2){animation-delay:.1s}.flame:nth-of-type(3){animation-delay:.2s}
  @keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.12) rotate(4deg)}}
  .cake.off .flame{display:none}
  .smoke{opacity:0}
  .cake.off .smoke{animation:smoke 1.8s ease-out}
  @keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
  .hint{font-weight:500;opacity:.7;font-size:.95rem}
  .scroll{margin-top:18px;font-size:2rem;animation:bounce 1.2s infinite}
  @keyframes bounce{50%{transform:translateY(10px)}}

  /* RIBBON */
  .ribbon{position:relative;z-index:2;background:var(--ink);color:var(--yellow);overflow:hidden;white-space:nowrap;
          padding:14px 0;transform:rotate(-1.5deg);margin:20px -20px;font-weight:600;font-size:1.2rem}
  .ribbon div{display:inline-block;animation:marq 22s linear infinite}
  @keyframes marq{to{transform:translateX(-50%)}}

  h2{font-size:clamp(2rem,7vw,3.4rem);font-weight:700;margin-bottom:12px}
  h2 em{font-style:normal;color:var(--pink)}
  .sub{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--purple);margin-bottom:34px}

  /* COUNTER */
  .counter{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px}
  .box{border:4px solid var(--ink);border-radius:24px;padding:22px 10px;box-shadow:6px 6px 0 var(--ink);background:#fff}
  .box:nth-child(1){background:var(--yellow)}.box:nth-child(2){background:var(--blue)}
  .box:nth-child(3){background:var(--pink);color:#fff}.box:nth-child(4){background:var(--green)}
  .box b{display:block;font-size:2.8rem;line-height:1}
  .box span{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em}

  /* REASONS */
  .reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;padding:10px}
  .card{background:#fff;border:4px solid var(--ink);border-radius:26px;padding:26px 22px;box-shadow:7px 7px 0 var(--ink);
        text-align:left;opacity:0;transform:translateY(40px) rotate(0);transition:all .7s cubic-bezier(.2,1.4,.4,1)}
  .card.show{opacity:1}
  .card:nth-child(odd).show{transform:rotate(-1.8deg)}
  .card:nth-child(even).show{transform:rotate(1.8deg)}
  .card:hover{transform:rotate(0) scale(1.04)!important}
  .card .em{font-size:2.6rem;display:inline-block;animation:pop 2s ease-in-out infinite}
  @keyframes pop{50%{transform:scale(1.18) rotate(8deg)}}
  .card h3{margin:8px 0 6px;font-size:1.35rem}
  .card p{font-weight:400;line-height:1.5;opacity:.85}
  .c0{background:#fff0f7}.c1{background:#fffbe0}.c2{background:#e9f8ff}.c3{background:#ecfff6}.c4{background:#f3ecff}.c5{background:#fff1e6}

 

  /* LETTER */
  .letter{background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:10px 10px 0 var(--ink);
          padding:40px 30px;text-align:left;max-width:700px;margin:0 auto 34px;position:relative;
          background-image:repeating-linear-gradient(transparent 0 35px,rgba(62,198,255,.25) 35px 37px)}
  .letter::before{content:"💌";position:absolute;top:-28px;right:26px;font-size:3.2rem;transform:rotate(12deg)}
  .letter p{font-size:1.2rem;line-height:37px;opacity:0;transform:translateY(16px);transition:all .8s}
  .letter p.show{opacity:1;transform:none}
  .letter p+p{margin-top:12px}
  .sign{font-family:'Caveat',cursive;font-size:2.3rem;color:var(--pink);text-align:right;margin-top:10px}
  .btn{font-family:inherit;font-size:1.25rem;font-weight:700;padding:16px 36px;border-radius:999px;border:4px solid var(--ink);
       background:var(--pink);color:#fff;cursor:pointer;box-shadow:6px 6px 0 var(--ink);transition:all .15s}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
  .btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
  .final{display:none;margin-top:36px;animation:zoom .8s cubic-bezier(.2,1.6,.4,1)}
  @keyframes zoom{from{opacity:0;transform:scale(.3) rotate(-10deg)}}
  .final h2{font-size:clamp(2.2rem,8vw,4.2rem)}
  footer{position:relative;z-index:2;text-align:center;padding:40px 20px 60px;font-weight:500;opacity:.7}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="balloons" id="balloons"></div>

<!-- HERO -->
<section class="hero">
  <span class="pill" id="data">🎂 17 NOVEMBRE</span>
  <h1>Buon<br>compleanno<br><span class="name" id="nome">Giulia!</span></h1>
  <div class="hand" id="sottotitolo">oggi si festeggia la persona più bella del mondo</div>

  <svg class="cake" id="cake" viewBox="0 0 260 260" aria-label="Torta di compleanno">
    <!-- fiammelle -->
    <g>
      <path class="flame" d="M90 30c8 10 10 18 0 26-10-8-8-16 0-26z" fill="#ff8a3d"/>
      <path class="flame" d="M130 20c9 11 11 20 0 29-11-9-9-18 0-29z" fill="#ffd23f"/>
      <path class="flame" d="M170 30c8 10 10 18 0 26-10-8-8-16 0-26z" fill="#ff8a3d"/>
      <g class="smoke" fill="#bbb"><circle cx="90" cy="40" r="6"/><circle cx="130" cy="32" r="7"/><circle cx="170" cy="40" r="6"/></g>
    </g>
    <!-- candeline -->
    <rect x="85" y="56" width="10" height="42" rx="4" fill="#3ec6ff" stroke="#2a1650" stroke-width="4"/>
    <rect x="125" y="49" width="10" height="49" rx="4" fill="#ff4fa3" stroke="#2a1650" stroke-width="4"/>
    <rect x="165" y="56" width="10" height="42" rx="4" fill="#3ddc97" stroke="#2a1650" stroke-width="4"/>
    <!-- piano alto -->
    <rect x="62" y="96" width="136" height="54" rx="14" fill="#ffd23f" stroke="#2a1650" stroke-width="5"/>
    <path d="M62 112q17 18 34 0t34 0 34 0 34 0v-2" fill="#ff4fa3" stroke="#2a1650" stroke-width="5"/>
    <!-- piano basso -->
    <rect x="30" y="150" width="200" height="68" rx="16" fill="#ff9ccf" stroke="#2a1650" stroke-width="5"/>
    <path d="M30 168q20 20 40 0t40 0 40 0 40 0 40 0" fill="#fff" stroke="#2a1650" stroke-width="5"/>
    <circle cx="70" cy="196" r="6" fill="#ffd23f" stroke="#2a1650" stroke-width="3"/>
    <circle cx="130" cy="200" r="6" fill="#3ec6ff" stroke="#2a1650" stroke-width="3"/>
    <circle cx="190" cy="196" r="6" fill="#8b5cf6" stroke="#2a1650" stroke-width="3"/>
    <!-- piatto -->
    <rect x="14" y="216" width="232" height="18" rx="9" fill="#8b5cf6" stroke="#2a1650" stroke-width="5"/>
  </svg>
  <div class="hint" id="hint">tocca la torta</div>
  <div class="scroll">👇</div>
</section>

<div class="ribbon"><div id="ribbon"></div></div>



<!-- LETTERA -->
<section>
  <h2>Per <em>te</em></h2>
  <div class="letter" id="letter"></div>
  <button class="btn" id="finalBtn">Clicca qui ❤️</button>
  <div class="final" id="final"></div>
</section>

<footer id="footer">❤️</footer>

<script>
/* ================= PERSONALIZZA QUI ================= */
const CONFIG = {
  nome: "Giulia!",
  dataLabel: "🎂 17 NOVEMBRE",
  sottotitolo: "ho preparato una cosa per te",
  firma: "Con tutto il mio amore",
  ribbon: ["BUON COMPLEANNO", "🎉", "GIULIA", "🎈", "TI AMO", "🎂", "💖"],
  
  lettera: [
    "Tanti auguri amore mio! 🎂",
    "Mi sento tanto fortunato ad averti, e mi fido tanto di te.",
    "Ti amo, sei bellissima. ❤️"
  ],
  finaleTitolo: "Buon compleanno Giulia! ❤️",
  finaleTesto: "Ti amo tanto, amore mio."
};
/* ===================================================== */

const $ = id => document.getElementById(id);
$('nome').textContent = CONFIG.nome;
$('data').textContent = CONFIG.dataLabel;
$('sottotitolo').textContent = CONFIG.sottotitolo;
$('ribbon').textContent = '';
$('ribbon').innerHTML = (CONFIG.ribbon.join(' &nbsp;•&nbsp; ') + ' &nbsp;•&nbsp; ').repeat(6);

// Palloncini
const balloons = $('balloons');
['🎈','🎈','🎈','🎉','💖','⭐','🎈','💛'].forEach((e,i) => {
  for (let k=0;k<2;k++){
    const s = document.createElement('span');
    s.textContent = e;
    s.style.left = (Math.random()*95) + 'vw';
    s.style.fontSize = (28 + Math.random()*34) + 'px';
    s.style.animationDuration = (14 + Math.random()*14) + 's';
    s.style.animationDelay = (-Math.random()*25) + 's';
    balloons.appendChild(s);
  }
});


// Lettera
$('letter').innerHTML = CONFIG.lettera.map(p => `<p>${p}</p>`).join('') +
  `<div class="sign">${CONFIG.firma} ❤️</div>`;

// Comparsa allo scroll
const io = new IntersectionObserver((es) => es.forEach(e => {
  if (e.isIntersecting) {
    const d = [...e.target.parentElement.children].indexOf(e.target) * 120;
    setTimeout(() => e.target.classList.add('show'), d);
  }
}), {threshold:.25});
document.querySelectorAll('.card, .letter p').forEach(el => io.observe(el));

// Coriandoli
const cv = $('confetti'), ctx = cv.getContext('2d');
let pcs = [], run = false;
const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
addEventListener('resize', resize); resize();
function burst(n=140, x=innerWidth/2, y=innerHeight/2.5){
  const cols = ['#ff4fa3','#ffd23f','#3ec6ff','#8b5cf6','#3ddc97','#ff8a3d'];
  for (let i=0;i<n;i++) pcs.push({
    x, y, vx:(Math.random()-.5)*20, vy:Math.random()*-16-3,
    w:Math.random()*9+5, h:Math.random()*6+4, c:cols[i%cols.length],
    r:Math.random()*6, vr:(Math.random()-.5)*.4, circle:Math.random()<.25, life:0
  });
  if (!run) { run = true; loop(); }
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for (const p of pcs){
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.circle){ ctx.beginPath(); ctx.arc(0,0,p.h/1.3,0,7); ctx.fill(); }
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  pcs = pcs.filter(p => p.y < cv.height+30 && p.life < 320);
  if (pcs.length) requestAnimationFrame(loop); else run = false;
}

// Torta
$('cake').onclick = () => {
  const c = $('cake');
  if (c.classList.contains('off')) {
    c.classList.remove('off'); $('hint').textContent = 'tocca la torta'; return;
  }
  c.classList.add('off');
  $('hint').textContent = 'scorri giù';
  burst(180); setTimeout(() => burst(120), 350);
};

// Finale
$('finalBtn').onclick = e => {
  e.target.style.display = 'none';
  $('final').style.display = 'block';
  $('final').innerHTML = `<h2>${CONFIG.finaleTitolo}</h2><p style="font-size:1.3rem;font-weight:500;max-width:560px;margin:0 auto">${CONFIG.finaleTesto}</p>`;
  burst(260, innerWidth*.2, innerHeight*.6); burst(260, innerWidth*.8, innerHeight*.6);
  setTimeout(() => burst(200), 500); setTimeout(() => burst(200), 1100);
};
</script>
</body>
</html>
